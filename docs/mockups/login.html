<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - DraftURL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a2e;
      --bg-elevated: #1e1e32;
      --border: #2a2a40;
      --border-hover: #3a3a55;
      --text-primary: #e8e8f0;
      --text-secondary: #9090a8;
      --text-muted: #606078;
      --accent: #7c5cfc;
      --accent-hover: #6a48e8;
      --accent-glow: rgba(124, 92, 252, 0.15);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      height: 56px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
      color: white;
      box-shadow: 0 8px 32px rgba(124, 92, 252, 0.25);
    }

    .login-card h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 32px;
    }

    /* Social buttons */
    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
      text-decoration: none;
    }

    .social-btn-google {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .social-btn-google:hover {
      background: var(--bg-tertiary);
      border-color: var(--border-hover);
    }

    .social-btn-github {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .social-btn-github:hover {
      background: var(--bg-tertiary);
      border-color: var(--border-hover);
    }

    .social-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Google SVG icon inline */
    .google-icon svg {
      width: 20px;
      height: 20px;
    }

    .github-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Benefits */
    .benefits {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: left;
    }

    .benefits-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .benefit-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .benefit-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #34d399;
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text-secondary);
    }

    /* Loading state */
    .social-btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    .social-btn.loading .spinner {
      display: block;
    }

    .social-btn.loading .social-icon {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">D</div>
      DraftURL
    </a>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="login-card">
      <div class="login-icon">D</div>
      <h1>DraftURL에 로그인</h1>
      <p class="subtitle">문서를 영구 보관하고, 대시보드에서 관리하세요.</p>

      <!-- Social Login Buttons -->
      <div class="social-buttons">
        <button class="social-btn social-btn-google" id="googleBtn" onclick="handleLogin('google')">
          <span class="social-icon google-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
          </span>
          <div class="spinner"></div>
          Google로 계속하기
        </button>

        <button class="social-btn social-btn-github" id="githubBtn" onclick="handleLogin('github')">
          <span class="social-icon github-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
            </svg>
          </span>
          <div class="spinner"></div>
          GitHub로 계속하기
        </button>
      </div>

      <div class="divider">가입하면 이런 기능을 사용할 수 있어요</div>

      <!-- Benefits -->
      <div class="benefits">
        <div class="benefit-item">
          <span class="benefit-check">&#10003;</span>
          <span>문서 영구 보관 (만료 없음)</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-check">&#10003;</span>
          <span>대시보드에서 문서 관리</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-check">&#10003;</span>
          <span>문서 수정 및 재배포</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-check">&#10003;</span>
          <span>AI 수정 기능 (Coming Soon)</span>
        </div>
      </div>

      <a href="index.html" class="back-link">&#8592; 로그인 없이 사용하기</a>
    </div>
  </main>

  <!-- Footer -->
  <div class="footer">
    계속 진행하면 <a href="#">서비스 이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
  </div>

  <script>
    function handleLogin(provider) {
      const btnId = provider === 'google' ? 'googleBtn' : 'githubBtn';
      const btn = document.getElementById(btnId);
      btn.classList.add('loading');

      // Simulate login redirect
      setTimeout(() => {
        btn.classList.remove('loading');
        // In real app, this would redirect to OAuth provider
        window.location.href = 'dashboard.html';
      }, 1500);
    }
  </script>
</body>
</html>
