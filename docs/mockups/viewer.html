<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간 보고서 - DraftURL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a2e;
      --border: #2a2a40;
      --border-hover: #3a3a55;
      --text-primary: #e8e8f0;
      --text-secondary: #9090a8;
      --text-muted: #606078;
      --accent: #7c5cfc;
      --accent-hover: #6a48e8;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top branding bar */
    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 44px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .viewer-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .viewer-bar-left a {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .viewer-bar-left a:hover {
      color: var(--accent);
    }

    .mini-logo {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: white;
      font-weight: 700;
    }

    .viewer-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-xs);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .btn-primary { background: var(--accent); color: white; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Document content area */
    .viewer-content {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow: auto;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Bottom CTA bar */
    .bottom-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .bottom-cta-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .bottom-cta .btn-primary {
      padding: 8px 18px;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .viewer-bar {
        padding: 0 12px;
      }
      .bottom-cta {
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Branding Bar -->
  <div class="viewer-bar">
    <div class="viewer-bar-left">
      <a href="index.html">
        <span class="mini-logo">D</span>
        <span>DraftURL</span>
      </a>
      <span style="color: var(--text-muted);">|</span>
      <span>주간 보고서</span>
    </div>
    <div class="viewer-bar-right">
      <button class="btn btn-ghost btn-sm" onclick="copyCurrentUrl()">&#128279; URL 복사</button>
    </div>
  </div>

  <!-- Document Content -->
  <div class="viewer-content">
    <iframe class="viewer-frame" id="docFrame" sandbox="allow-scripts"></iframe>
  </div>

  <!-- Bottom CTA -->
  <div class="bottom-cta">
    <span class="bottom-cta-text">이 문서는 DraftURL로 만들어졌습니다.</span>
    <a href="index.html" class="btn btn-primary">&#9889; 나도 문서 공유하기</a>
  </div>

    // Load document into iframe
    document.getElementById('docFrame').srcdoc = sampleDocument;

    function copyCurrentUrl() {
      const url = 'https://drafturl.com/xK9mP2nQ';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => showToast('URL이 복사되었습니다!'));
      } else {
        showToast('URL이 복사되었습니다!');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.transform = 'translateY(80px)';
        toast.style.opacity = '0';
      }, 2500);
    }
  </script>
</body>
