<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftURL - 공유 완료</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a2e;
      --bg-elevated: #1e1e32;
      --border: #2a2a40;
      --border-hover: #3a3a55;
      --text-primary: #e8e8f0;
      --text-secondary: #9090a8;
      --text-muted: #606078;
      --accent: #7c5cfc;
      --accent-hover: #6a48e8;
      --accent-glow: rgba(124, 92, 252, 0.15);
      --success: #34d399;
      --warning: #fbbf24;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-xs);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .btn-outline { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--border-hover); background: var(--bg-tertiary); }
    .btn-primary { background: var(--accent); color: white; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Main Content */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.15), rgba(52, 211, 153, 0.05));
      border: 2px solid rgba(52, 211, 153, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.2); }
      50% { box-shadow: 0 0 0 16px rgba(52, 211, 153, 0); }
    }

    .container h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .container .subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 32px;
    }

    /* URL Card */
    .url-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .url-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .url-main {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .url-main input {
      flex: 1;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 17px;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
      outline: none;
      min-width: 0;
    }

    .copy-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .url-meta {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .url-meta span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* QR Placeholder */
    .qr-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .qr-placeholder {
      width: 160px;
      height: 160px;
      background: var(--bg-tertiary);
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      flex-direction: column;
      gap: 4px;
    }

    .qr-placeholder-icon {
      font-size: 32px;
      opacity: 0.3;
    }

    .qr-placeholder-text {
      font-size: 11px;
      color: var(--text-muted);
    }

    .qr-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge-coming {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(124, 92, 252, 0.15);
      color: var(--accent);
      margin-left: 4px;
    }

    /* CTA Banner */
    .cta-banner {
      background: linear-gradient(135deg, rgba(124, 92, 252, 0.1), rgba(96, 165, 250, 0.08));
      border: 1px solid rgba(124, 92, 252, 0.2);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .cta-banner .timer-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .cta-banner h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .cta-banner p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .cta-banner .btn-primary {
      padding: 10px 24px;
    }

    /* Countdown */
    .countdown {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 14px;
      color: var(--warning);
      margin-bottom: 4px;
    }

    .countdown-num {
      font-family: 'SF Mono', monospace;
      font-weight: 700;
      font-size: 20px;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .actions .btn {
      padding: 10px 20px;
    }

    /* Share buttons */
    .share-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }

    .share-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 16px;
      color: var(--text-secondary);
    }

    .share-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 20px;
      font-size: 14px;
      color: var(--text-primary);
      z-index: 100;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .toast.show { transform: translateY(0); opacity: 1; }

    /* Confetti effect */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 200;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confetti-fall 3s ease-out forwards;
      opacity: 0;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Confetti -->
  <div class="confetti-container" id="confetti"></div>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">D</div>
      DraftURL
    </a>
    <div class="header-actions">
      <a href="dashboard.html" class="btn btn-ghost">내 문서</a>
      <a href="login.html" class="btn btn-outline">로그인</a>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container">
    <div class="success-icon">&#10003;</div>
    <h1>문서가 공유되었습니다!</h1>
    <p class="subtitle">누구나 아래 URL로 문서에 접근할 수 있습니다.</p>

    <!-- URL Card -->
    <div class="url-card">
      <div class="url-label">공유 URL</div>
      <div class="url-main">
        <input type="text" id="shareUrl" value="https://drafturl.com/xK9mP2nQ" readonly>
        <button class="btn btn-primary copy-btn" onclick="copyUrl()">복사</button>
      </div>
      <div class="url-meta">
        <span>&#128196; HTML 문서</span>
        <span>&#128290; 12.4 KB</span>
        <span>&#128337; 방금 생성</span>
      </div>
      <div class="share-row">
        <button class="share-btn" title="Twitter/X에 공유" onclick="showToast('Twitter 공유 (목업)')">&#120143;</button>
        <button class="share-btn" title="이메일로 공유" onclick="showToast('이메일 공유 (목업)')">&#9993;</button>
        <button class="share-btn" title="Slack에 공유" onclick="showToast('Slack 공유 (목업)')">&#9889;</button>
      </div>
    </div>

    <!-- QR Code (Phase 2 placeholder) -->
    <div class="qr-section">
      <div class="qr-placeholder">
        <span class="qr-placeholder-icon">&#9638;</span>
        <span class="qr-placeholder-text">QR Code</span>
      </div>
      <div class="qr-label">QR 코드로 공유 <span class="badge-coming">Coming Soon</span></div>
    </div>

    <!-- CTA Banner -->
    <div class="cta-banner">
      <div class="timer-icon">&#9200;</div>
      <div class="countdown">
        <span class="countdown-num" id="hours">23</span>시간
        <span class="countdown-num" id="minutes">59</span>분
        <span class="countdown-num" id="seconds">42</span>초 후 만료
      </div>
      <h3>가입하면 영구 보관!</h3>
      <p>무료 계정으로 문서를 영구 보관하고, 최대 3개의 문서를 관리하세요.</p>
      <a href="login.html" class="btn btn-primary">무료 가입하기</a>
    </div>

    <!-- Actions -->
    <div class="actions">
      <a href="viewer.html" class="btn btn-outline">&#128064; 문서 보기</a>
      <a href="index.html" class="btn btn-outline">&#10010; 새 문서 만들기</a>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // Copy URL
    function copyUrl() {
      const input = document.getElementById('shareUrl');
      input.select();
      document.execCommand('copy');
      showToast('URL이 클립보드에 복사되었습니다!');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Countdown timer (mock)
    let totalSeconds = 23 * 3600 + 59 * 60 + 42;

    function updateCountdown() {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
      if (totalSeconds > 0) totalSeconds--;
    }

    setInterval(updateCountdown, 1000);

    // Confetti on load
    function createConfetti() {
      const container = document.getElementById('confetti');
      const colors = ['#7c5cfc', '#a78bfa', '#60a5fa', '#34d399', '#fbbf24', '#f87171'];
      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 1.5 + 's';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.width = (6 + Math.random() * 6) + 'px';
        piece.style.height = (6 + Math.random() * 6) + 'px';
        container.appendChild(piece);
      }
      setTimeout(() => container.innerHTML = '', 5000);
    }

    createConfetti();
  </script>
</body>
</html>
