# 공유 인프라: DB
# 파일 저장소는 Cloudflare R2 사용 (외부 서비스)
# 로컬/개발 서버와 독립적으로 항상 실행. 데이터 영속.
services:
  db:
    image: postgres:15-alpine
    container_name: drafturl-db
    environment:
      POSTGRES_DB: drafturl
      POSTGRES_USER: drafturl
      POSTGRES_PASSWORD: drafturl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - drafturl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drafturl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  drafturl-net:
    name: drafturl-net
