# 공유 인프라: DB + 파일 스토리지
# 로컬/개발 서버와 독립적으로 항상 실행. 데이터 영속.
services:
  db:
    image: postgres:15-alpine
    container_name: drafturl-db
    environment:
      POSTGRES_DB: drafturl
      POSTGRES_USER: drafturl
      POSTGRES_PASSWORD: drafturl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - drafturl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drafturl"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    container_name: drafturl-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - drafturl-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:

networks:
  drafturl-net:
    name: drafturl-net
