spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/drafturl
    username: drafturl
    password: drafturl
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

app:
  cdn:
    base-url: https://files.drafturl.com
  storage:
    endpoint: ${R2_ENDPOINT:https://your-account-id.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:change-me}
    secret-key: ${R2_SECRET_KEY:change-me}
    bucket: ${R2_BUCKET:drafturl-files}
    region: ${R2_REGION:auto}
  jwt:
    secret: local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256
    access-token-expiry: 3600000
    refresh-token-expiry: 604800000
  cors:
    allowed-origins: http://localhost:3000
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:placeholder}
      client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
    github:
      client-id: ${GITHUB_CLIENT_ID:placeholder}
      client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
  frontend-url: http://localhost:3000
  slug-length: 8
  anonymous-expiry-hours: 24
