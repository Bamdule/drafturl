spring:
  application:
    name: drafturl-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# Sentry (DSN이 비어있으면 자동 비활성화)
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 1.0
  environment: ${SPRING_PROFILES_ACTIVE:local}

# R2 스토리지 (Cloudflare R2 / S3 호환)
app:
  cdn:
    base-url: ${CDN_BASE_URL:https://files.drafturl.com}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    endpoint: ${R2_ENDPOINT:http://localhost:9000}
    access-key: ${R2_ACCESS_KEY:minioadmin}
    secret-key: ${R2_SECRET_KEY:minioadmin}
    bucket: ${R2_BUCKET:drafturl-files}
    region: ${R2_REGION:auto}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:placeholder}
      client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
    github:
      client-id: ${GITHUB_CLIENT_ID:placeholder}
      client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
    naver:
      client-id: ${NAVER_CLIENT_ID:placeholder}
      client-secret: ${NAVER_CLIENT_SECRET:placeholder}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:placeholder}
      client-secret: ${KAKAO_CLIENT_SECRET:placeholder}
