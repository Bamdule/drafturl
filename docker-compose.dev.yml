# 개발 서버: 외부 접근용 (Cloudflare Tunnel)
# Backend :8050, Frontend :3000 (프로덕션 빌드)
# 사용: docker compose -f docker-compose.dev.yml up -d --build
services:
  dev-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: drafturl-dev-backend
    ports:
      - "8050:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://drafturl-db:5432/drafturl
      SPRING_DATASOURCE_USERNAME: drafturl
      SPRING_DATASOURCE_PASSWORD: drafturl
      APP_STORAGE_ENDPOINT: https://783134ac29443aef7ee53440e14f66e1.r2.cloudflarestorage.com
      APP_STORAGE_ACCESS_KEY: 2b497c76d30e703460d5572001d4bac5
      APP_STORAGE_SECRET_KEY: f16d948160ddad5211cd5da1657afd6e6850e4f1a6ba91269ab8df97d9b4d58e
      APP_STORAGE_BUCKET: drafturl-files
      APP_CORS_ALLOWED_ORIGINS: https://drafturl.com,https://www.drafturl.com
      APP_FRONTEND_URL: https://drafturl.com
    networks:
      - drafturl-net
    restart: on-failure

  dev-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: drafturl-dev-frontend
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://drafturl-dev-backend:8080
    networks:
      - drafturl-net
    depends_on:
      - dev-backend

networks:
  drafturl-net:
    external: true
