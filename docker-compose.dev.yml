# 개발 서버: 외부 접근용 (Cloudflare Tunnel)
# Backend :8050, Frontend :3000 (프로덕션 빌드)
# 사용: docker compose -f docker-compose.dev.yml up -d --build
services:
  dev-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: drafturl-dev-backend
    ports:
      - "8050:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://drafturl-db:5432/drafturl
      SPRING_DATASOURCE_USERNAME: drafturl
      SPRING_DATASOURCE_PASSWORD: drafturl
      APP_STORAGE_ENDPOINT: ${R2_ENDPOINT}
      APP_STORAGE_ACCESS_KEY: ${R2_ACCESS_KEY}
      APP_STORAGE_SECRET_KEY: ${R2_SECRET_KEY}
      APP_STORAGE_BUCKET: ${R2_BUCKET:-drafturl-files}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: https://drafturl.com,https://www.drafturl.com
      APP_FRONTEND_URL: https://drafturl.com
      APP_MCP_OAUTH2_ISSUER: https://drafturl.com
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    networks:
      - drafturl-net
    restart: unless-stopped

  dev-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: drafturl-dev-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      INTERNAL_API_URL: http://drafturl-dev-backend:8080
    networks:
      - drafturl-net
    depends_on:
      - dev-backend
    restart: unless-stopped

networks:
  drafturl-net:
    external: true
