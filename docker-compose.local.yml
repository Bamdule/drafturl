# 로컬 서버: 로컬 테스트용
# Backend :8051, Frontend :3001 (dev 모드, 핫 리로드)
# 사용: docker compose -f docker-compose.local.yml up -d
services:
  local-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: drafturl-local-backend
    ports:
      - "8051:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://drafturl-db:5432/drafturl
      SPRING_DATASOURCE_USERNAME: drafturl
      SPRING_DATASOURCE_PASSWORD: drafturl
      APP_STORAGE_ENDPOINT: https://783134ac29443aef7ee53440e14f66e1.r2.cloudflarestorage.com
      APP_STORAGE_ACCESS_KEY: 2b497c76d30e703460d5572001d4bac5
      APP_STORAGE_SECRET_KEY: f16d948160ddad5211cd5da1657afd6e6850e4f1a6ba91269ab8df97d9b4d58e
      APP_STORAGE_BUCKET: drafturl-files
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3001
      APP_FRONTEND_URL: http://localhost:3001
    networks:
      - drafturl-net
    restart: on-failure

  local-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: drafturl-local-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8051
      INTERNAL_API_URL: http://drafturl-local-backend:8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - drafturl-net
    depends_on:
      - local-backend

networks:
  drafturl-net:
    external: true
